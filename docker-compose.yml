version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: movemate_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: movemate_backend
    env_file:
      - .env
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app             
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py seed_exercises &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/docs/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: movemate_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app        
      - /app/node_modules      
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_AI_SERVICE_URL=http://localhost:9001
    depends_on:
      - backend


  ai_service:
    build:
      context: ./ai_model
      dockerfile: Dockerfile
    container_name: movemate_ai
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - ./ai_model:/app
    depends_on:
      - backend
    profiles:
      - ai                      
volumes:
  postgres_data:
